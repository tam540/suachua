<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #1f514b; --accent: #e3a94c; --bg: #faedd0; --white: #ffffff; --text-gray: #555555;
}
body {
  font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: var(--primary);
  display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 15px; box-sizing: border-box;
}
.container {
  background: var(--white); padding: 35px 25px; border-radius: 16px; box-shadow: 0 12px 30px rgba(31, 81, 75, 0.15); max-width: 480px; width: 100%;
  box-sizing: border-box;
}
.header { text-align: center; margin-bottom: 25px; }
.subtitle { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
.title { font-size: 20px; font-weight: 700; margin: 10px 0; line-height: 1.4; color: var(--primary); }
.form-group { margin-bottom: 18px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--primary); }
input {
  width: 100%; padding: 14px; border: 1.5px solid #e0e0e0; border-radius: 8px;
  font-family: 'Montserrat', sans-serif; font-size: 14px; box-sizing: border-box; transition: all 0.3s;
}
input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(31, 81, 75, 0.1); }
button {
  width: 100%; background-color: var(--primary); color: var(--white); border: none;
  padding: 16px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer;
  font-family: 'Montserrat', sans-serif; transition: background 0.3s, transform 0.1s; margin-top: 10px;
}
button:hover { background-color: #163d38; }
button:active { transform: scale(0.98); }
button:disabled { background-color: #a0b2b0; cursor: not-allowed; }
#qrSection, #freeSuccessSection { display: none; text-align: center; }
.qr-box { border: 2px dashed var(--accent); padding: 20px; border-radius: 12px; margin: 20px 0; background: #fafafa; }
.qr-box img { max-width: 85%; height: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: block; margin: 0 auto; }
.amount { font-size: 26px; font-weight: 700; color: var(--accent); margin: 15px 0 5px; }
.transfer-content-box { margin-top: 15px; }
.transfer-content {
  background: var(--bg); padding: 10px 20px; border-radius: 8px; font-weight: 700;
  font-size: 20px; color: var(--primary); letter-spacing: 1.5px; display: inline-block; border: 1px solid var(--accent); user-select: all;
}
.save-instruction {
  background-color: #fff8e1; color: #b97700; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
  margin: 15px auto 5px auto; width: 90%; border: 1px dashed #e3a94c; line-height: 1.5;
}
.info-tip { font-size: 13px; color: var(--text-gray); background-color: #f8f9fa; border-left: 4px solid var(--primary); padding: 15px; border-radius: 6px; text-align: left;
  margin: 15px 0; line-height: 1.6; }
.warning-tip { font-size: 13px; color: #b71c1c; background-color: #fce4e4; border-left: 4px solid #f44336; padding: 15px; border-radius: 6px; text-align: left;
  margin: 15px 0; line-height: 1.6; }
.success-icon { font-size: 50px; margin-bottom: 10px; }
</style>
